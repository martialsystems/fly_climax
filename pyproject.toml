[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-climax"
version = "0.1.0"
description = "Public-connectome equivalent of the 2018 abdominal pulse. Candidate INXXX149. Climax not simulated."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Martial Systems LLC" }]
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
malecns = ["pandas>=2.0", "pyarrow>=14"]

[project.scripts]
fly-climax = "fly_climax.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
