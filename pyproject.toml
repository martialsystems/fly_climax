[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-abgcrz"
version = "0.1.0"
description = "Candidate INXXX149 Gautham-4 hop-1/hop-2 on MaleCNS v1.0 plus a toy LIF pulse"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Martial Systems LLC" }]
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
malecns = ["pandas>=2.0", "pyarrow>=14"]

[project.scripts]
fly-abgcrz = "fly_abgcrz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
